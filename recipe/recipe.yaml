schema_version: 1

context:
  name: python-pdal
  version: "3.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/PDAL/python/archive/${{ version }}.tar.gz
  sha256: c51542a99f5a770ba6154a45b48c5cacab5c068583894164175fa2d62a14db5f

build:
  number: 0
  skip: match(python, "<3.10")

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - make
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
        - pybind11
        - scikit-build-core
    - curl
    - cmake
    - ninja
    - if: win
      then: m2-sed
    - if: unix
      then: sed
  host:
    - python
    - libpdal-core
    - numpy
    - pybind11
    - scikit-build-core
    - pip
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - pdal
  - requirements:
      run:
        - pip
        - pytest
    script:
      - pip check

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Point Data Abstraction Library (PDAL) Python Package
  description: |
    Python package for the PDAL library.
  homepage: https://pdal.io
  repository: https://github.com/PDAL/python
  documentation: https://pdal.io

extra:
  recipe-maintainers:
    - chambbj
    - hobu
